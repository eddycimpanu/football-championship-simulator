# Web application (org.example.web.WebApplication)
server.port=8080

# The database settings come from db.properties (kept out of Git), the same file the console uses
spring.config.import=classpath:db.properties
spring.datasource.url=${db.url}
spring.datasource.username=${db.user}
spring.datasource.password=${db.password}

# Error answers include the reason, e.g. "Not enough credits for a stake of 50.00", so the page can show it
server.error.include-message=always
